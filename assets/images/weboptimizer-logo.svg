  </defs>

  <!-- Luxury Crest Emblem -->
  <rect x="2" y="4" width="48" height="48" rx="12" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <rect x="6" y="8" width="40" height="40" rx="9" stroke="url(#goldGrad)" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Geometric W + Upward Growth Vector -->
  <path d="M13 19L18.5 37L26 23.5L33.5 37L39 19" stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="26" cy="15.5" r="2.2" fill="#F9E498"/>

  <!-- Brand Wordmark -->
  <text x="62" y="30" font-family="'Cinzel', 'Plus Jakarta Sans', 'Segoe UI', Arial, serif" font-size="20" font-weight="800" letter-spacing="1.8" fill="#FFFFFF">
